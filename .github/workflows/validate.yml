name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.17.4
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/pellet_tracker/frontend/panel.js
      - run: node --test tests/test_frontend.cjs
      - run: npx --yes prettier@3.6.2 --check custom_components/pellet_tracker/frontend/panel.js
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
